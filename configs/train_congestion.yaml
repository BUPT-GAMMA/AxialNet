experiment:
  name: axialnet_congestion
  description: CircuitNet-N28 cross-design congestion training
  seed: 42
  device: cuda:0

data:
  type: CircuitFinetuneDataLoader
  dataset:
    type: DualFinetuneDataset
    root_dir: ${PROJECT_ROOT}/data/processed/net
    pixel_root_dir: ${PROJECT_ROOT}/data/processed/pixel
    net_root_dir: ${PROJECT_ROOT}/data/processed/net
    pixel_suffix: _pixel.pt
    net_suffix: _net.pt
  split_dir: ${PROJECT_ROOT}/splits/circuitnet_n28_cross_design
  regen_split: false
  split_ratio: [0.1, 0.1, 0.8]
  train_count: 705
  val_count: 705
  test_count: 3164
  loader:
    batch_size: 1
    num_workers: 4
    shuffle: true
    pin_memory: true

model:
  backbone:
    type: DualCongestionEncoder
    params:
      grid_in_dim: 4
      net_in_dim: 4
      hidden_dim: 64
      num_loops: 2
      apply_graph_updates: true
  head:
    type: DualCongestionHead
    params:
      hidden_channels: 128
      feat_channels: 128
      out_channels: 1
      num_layers: 3
      dropout: 0.3
      decode_mode: separate

solver:
  type: FinetuneSolver
  grad_accum_steps: 1
  freeze_backbone_epochs: 0
  loss_type: mse
  prediction_type: auto
  checkpoint_monitor: ssim
  checkpoint_mode: max
  ssim_loss_weight: 0.5
  early_stop:
    enable: true
    monitor: loss
    mode: min
    patience: 20
    min_delta: 1.0e-4
  optimizer:
    type: AdamW
    lr: 2.0e-3
    weight_decay: 1.0e-3
  scheduler:
    type: ReduceLROnPlateau
    monitor: loss
    mode: min
    factor: 0.75
    patience: 5
    threshold: 1.0e-6
    threshold_mode: rel
    cooldown: 0
    min_lr: 1.0e-8
    eps: 1.0e-8
  max_epochs: 100
  val_freq: 1
  log_interval: 10
  use_tqdm: true
  output_root: ${PROJECT_ROOT}/outputs
  resume_path: ''
