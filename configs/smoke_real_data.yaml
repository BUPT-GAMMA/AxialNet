# One-design train/validation/test exercise for installation checks only.
# It is not a scientific experiment and its metrics must not be reported.
experiment:
  name: smoke_real_data
  description: one-design end-to-end smoke test
  seed: 42
  device: cpu
data:
  type: CircuitFinetuneDataLoader
  dataset:
    type: DualFinetuneDataset
    root_dir: ${PROJECT_ROOT}/data/processed/net
    pixel_root_dir: ${PROJECT_ROOT}/data/processed/pixel
    net_root_dir: ${PROJECT_ROOT}/data/processed/net
    pixel_suffix: _pixel.pt
    net_suffix: _net.pt
  split_dir: ${PROJECT_ROOT}/tests/fixtures/one_sample_split
  regen_split: false
  loader:
    batch_size: 1
    num_workers: 0
    shuffle: false
    pin_memory: false
model:
  backbone:
    type: DualCongestionEncoder
    params:
      grid_in_dim: 4
      net_in_dim: 4
      hidden_dim: 64
      num_loops: 2
      apply_graph_updates: false
  head:
    type: DualCongestionHead
    params:
      hidden_channels: 128
      feat_channels: 128
      out_channels: 1
      num_layers: 3
      dropout: 0.3
      decode_mode: separate
solver:
  type: FinetuneSolver
  grad_accum_steps: 1
  freeze_backbone_epochs: 0
  loss_type: mse
  prediction_type: auto
  checkpoint_monitor: ssim
  checkpoint_mode: max
  ssim_loss_weight: 0.5
  early_stop:
    enable: false
  optimizer:
    type: AdamW
    lr: 2.0e-3
    weight_decay: 1.0e-3
  max_epochs: 1
  val_freq: 1
  log_interval: 1
  use_tqdm: false
  output_root: /tmp/axialnet-smoke
  resume_path: ''

